<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Then & Now — Support</title>
    <style>
        :root { --ink: #1d1d1f; --muted: #6e6e73; --bg: #fbfaf6; --accent: #0a7c4f; }
        @media (prefers-color-scheme: dark) {
            :root { --ink: #f5f5f7; --muted: #aeaeb2; --bg: #1c1c1e; }
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 600px; margin: 0 auto; padding: 96px 24px;
            background: var(--bg); color: var(--ink); line-height: 1.6;
        }
        h1 { font-size: 32px; font-weight: 600; }
        .muted { color: var(--muted); }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card { padding: 24px; background: rgba(0,0,0,0.04); border-radius: 12px; margin: 16px 0; }
        @media (prefers-color-scheme: dark) {
            .card { background: rgba(255,255,255,0.06); }
        }
    </style>
</head>
<body>
    <h1>Need help with Then &amp; Now?</h1>
    <p class="muted">Email us — we read every message.</p>

    <div class="card">
        <strong>Email</strong><br>
        <a href="mailto:hyblch9449@gmail.com">hyblch9449@gmail.com</a>
    </div>

    <p class="muted">Please include your iOS version and iPhone model when reporting a bug.</p>
</body>
</html>
